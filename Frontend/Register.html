<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Remmick</title>
    <link rel="stylesheet" href="Style/Register.css">
    <link rel="icon" type="image/png" href="Images/Logo.png">
</head>

<body>
<div class="register-box">
    <div class="header">
        <h2>Remmick Finance Assistant</h2>
        <p>📅 Faça o seu cadastro!</p>
    </div>

    <div class="form-container">
        <form id="registerform">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="name" id="name" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmar senha</label>
                <input type="password" id="confirm_password" placeholder="Confirme sua senha" required>
            </div>

            <button type="submit" class="btn-register">Cadastrar</button>
        </form>
        <div id="mensage" class="error-msg"></div>

        <div class="footer">
            Já tem conta? <a href="Login.html">Faça login</a>
        </div>
    </div>
</div>

<script src="Js/Register.js"></script>
    
</body>
</html>
